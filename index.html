<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f3;--fg:#3a1f2b;--accent:#d6336c;--accent2:#ff9a8b;--card:#ffffff;--glow:rgba(214,51,108,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14070d;--fg:#ffe9ee;--accent:#ff6b9a;--accent2:#ffb199;--card:#24101a;--glow:rgba(255,107,154,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14070d;--fg:#ffe9ee;--accent:#ff6b9a;--accent2:#ffb199;--card:#24101a;--glow:rgba(255,107,154,.35);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:'Playfair Display',Georgia,serif;overflow-x:hidden;min-height:100vh}
canvas#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:float 14s ease-in-out infinite alternate;background:var(--accent)}
.b1{width:40vw;height:40vw;left:-10vw;top:-10vw}
.b2{width:35vw;height:35vw;right:-8vw;top:40vh;background:var(--accent2);animation-delay:-5s}
@keyframes float{to{transform:translate(8vw,10vh) scale(1.2)}}
section{position:relative;z-index:2;padding:12vh 6vw;max-width:1100px;margin:0 auto}
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.script{font-family:'Caveat',cursive,sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);color:var(--accent)}
h1{font-size:clamp(3rem,13vw,8rem);line-height:1;margin:.2em 0;background:linear-gradient(110deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
#typed{font-style:italic;font-size:clamp(1rem,2.6vw,1.5rem);min-height:2.2em;opacity:.85}
#typed::after{content:'|';animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.down{margin-top:5vh;font-size:2rem;color:var(--accent);animation:bounce 2s infinite;text-decoration:none}
@keyframes bounce{50%{transform:translateY(12px)}}
h2{text-align:center;font-size:clamp(1.8rem,5vw,3rem);margin-bottom:1.2em}
.counter{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.counter div{background:var(--card);padding:1.2rem 1.6rem;border-radius:20px;box-shadow:0 10px 40px var(--glow);text-align:center;min-width:100px}
.counter b{display:block;font-size:2.4rem;color:var(--accent)}
.counter span{font-size:.85rem;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.6rem;perspective:1000px}
.slot{aspect-ratio:3/4;border-radius:22px;background:var(--card);box-shadow:0 14px 50px var(--glow);overflow:hidden;cursor:pointer;position:relative;opacity:0;transform:translateY(60px) rotate(var(--r,0deg));transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),box-shadow .3s;display:grid;place-items:center}
.slot.in{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}
.slot:nth-child(odd){--r:-1.5deg}.slot:nth-child(even){--r:1.5deg}
.slot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.slot:hover img{transform:scale(1.08)}
.slot .ph{text-align:center;color:var(--accent);font-family:'Caveat',cursive;font-size:1.5rem;padding:1rem;border:2px dashed var(--accent);border-radius:16px;margin:1rem;width:calc(100% - 2rem);height:calc(100% - 2rem);display:grid;place-items:center}
.cap{position:absolute;left:0;right:0;bottom:0;padding:1.4rem 1rem .8rem;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-family:'Caveat',cursive;font-size:1.4rem;transform:translateY(100%);transition:transform .4s}
.slot:hover .cap{transform:none}
.letter{background:var(--card);border-radius:26px;padding:clamp(1.6rem,5vw,3.5rem);box-shadow:0 20px 70px var(--glow);font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.8;text-align:center}
.letter p+p{margin-top:1em}
.sign{font-family:'Caveat',cursive;font-size:2.2rem;color:var(--accent);margin-top:1rem;display:block}
.btn{display:block;margin:2.5rem auto 0;border:0;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font:700 1.5rem 'Caveat',cursive,sans-serif;padding:.8rem 2.4rem;border-radius:999px;cursor:pointer;box-shadow:0 10px 30px var(--glow);transition:transform .2s}
.btn:hover{transform:scale(1.07)}.btn:active{transform:scale(.95)}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity 1s,transform 1.2s cubic-bezier(.7,0,.2,1);padding:env(safe-area-inset-top,0px) 1rem env(safe-area-inset-bottom,0px)}
#intro.gone{opacity:0;transform:scale(1.6);pointer-events:none}
.env{font-size:clamp(5rem,22vw,9rem);cursor:pointer;display:inline-block;animation:beat 1.2s infinite;filter:drop-shadow(0 10px 30px var(--glow));background:none;border:0}
@keyframes beat{15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
#lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:none;place-items:center;padding:1rem;cursor:zoom-out}
#lb.open{display:grid;animation:fade .3s}
#lb img{max-width:100%;max-height:92vh;border-radius:14px}
@keyframes fade{from{opacity:0}}
footer{position:relative;z-index:2;text-align:center;padding:4rem 1rem;opacity:.6;font-family:'Caveat',cursive;font-size:1.4rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<canvas id="hearts"></canvas>

<div id="intro">
  <div>
    <p class="script" style="margin-bottom:1rem">Небольшой сюрприз</p>
    <button class="env" id="open" aria-label="Открыть">✨</button>
    <p class="script" style="margin-top:1rem;opacity:.7">нажми, не бойся</p>
  </div>
</div>

<section id="hero">
  <p class="script">просто так, без повода</p>
  <h1 id="name">Привет</h1>
  <p id="typed"></p>
  <a class="down" href="#days" aria-label="Вниз">↓</a>
</section>

<section id="days">
  <h2>Мы вместе уже</h2>
  <div class="counter" id="counter"></div>
</section>

<section id="gallery">
  <h2>Кадры, которые мне нравятся</h2>
  <div class="grid" id="grid"></div>
</section>

<section id="letter">
  <h2>Пара слов</h2>
  <div class="letter" id="msg"></div>
  <button class="btn" id="love">Нажми, там сюрприз</button>
</section>

<footer>сделано с хорошим настроением ✨</footer>
<div id="lb"><img alt=""></div>
<input type="file" accept="image/*" id="file" hidden>

<script>
// ===== НАСТРОЙКИ: поменяй под себя =====
const CFG = {
  name: 'Привет',
  since: '',            // дата знакомства (ГГГГ-ММ-ДД) или '' чтобы скрыть счётчик
  typed: ['Решил сделать тебе что-нибудь приятное.', 'Надеюсь, ты улыбнёшься.'],
  message: [
    'Я не мастер красивых речей, поэтому сделал вот такую страничку.',
    'Мне нравится, как проходит время с тобой: легко, весело и без лишних слов.',
    'Хочется, чтобы таких моментов было ещё много.'
  ],
  sign: 'До скорой встречи',
  captions: ['Эти глаза','Настроение дня','Красивый кадр','Просто ты','Здесь ты в своей стихии','Люблю этот взгляд'],
  // фото лежат в папке photos/ (1.jpg ... 6.jpg). Нет файла - карточка просто скрывается
  photos: ['photos/1.jpg','photos/2.jpg','photos/3.jpg','photos/4.jpg','photos/5.jpg','photos/6.jpg']
};
const $ = s => document.querySelector(s);
$('#name').textContent = CFG.name;
$('#msg').innerHTML = CFG.message.map(t=>`<p>${t}</p>`).join('') + `<span class="sign">${CFG.sign} ✨</span>`;

// ===== Сердечки =====
const cv = $('#hearts'), cx = cv.getContext('2d');
let W, H, hearts = [];
function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', size); size();
const rose = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff6b9a';
function spawn(x, y, burst){
  hearts.push({x: x ?? Math.random()*W, y: y ?? H+20, s: 8+Math.random()*18,
    vx: burst ? (Math.random()-.5)*8 : (Math.random()-.5)*.6,
    vy: burst ? -2-Math.random()*7 : -.6-Math.random()*1.2,
    a: 1, life: burst ? .012 : .002, ph: Math.random()*6});
}
function heart(x,y,s){ cx.beginPath(); cx.moveTo(x,y+s*.3);
  cx.bezierCurveTo(x,y-s*.3,x-s,y-s*.3,x-s,y+s*.3);
  cx.bezierCurveTo(x-s,y+s*.8,x,y+s*1.1,x,y+s*1.4);
  cx.bezierCurveTo(x,y+s*1.1,x+s,y+s*.8,x+s,y+s*.3);
  cx.bezierCurveTo(x+s,y-s*.3,x,y-s*.3,x,y+s*.3); cx.fill(); }
(function loop(){
  cx.clearRect(0,0,W,H);
  if (Math.random() < .08 && hearts.length < 70) spawn();
  const c = rose();
  hearts = hearts.filter(h => h.a > 0 && h.y > -40);
  for (const h of hearts){
    h.ph += .03; h.x += h.vx + Math.sin(h.ph)*.4; h.y += h.vy; h.a -= h.life;
    if (h.vy < -1.5) h.vy *= .985;
    cx.globalAlpha = Math.max(0, h.a)*.55; cx.fillStyle = c; heart(h.x, h.y, h.s*.5);
  }
  requestAnimationFrame(loop);
})();

// ===== Вступление + печать текста =====
$('#open').onclick = e => {
  $('#intro').classList.add('gone');
  const r = e.target.getBoundingClientRect();
  for (let i=0;i<40;i++) spawn(r.left+r.width/2, r.top+r.height/2, true);
  setTimeout(typeLoop, 900);
};
let li = 0, ci = 0, del = false;
function typeLoop(){
  const t = CFG.typed[li], el = $('#typed');
  el.textContent = t.slice(0, ci);
  if (!del && ci < t.length) { ci++; return setTimeout(typeLoop, 70); }
  if (!del) { del = true; return setTimeout(typeLoop, 1800); }
  if (ci > 0) { ci--; return setTimeout(typeLoop, 30); }
  del = false; li = (li+1) % CFG.typed.length; setTimeout(typeLoop, 400);
}

// ===== Счётчик дней =====
if (CFG.since) {
  const start = new Date(CFG.since + 'T00:00:00');
  const box = $('#counter');
  const draw = () => {
    const d = Math.max(0, Date.now() - start);
    const v = [[Math.floor(d/864e5),'дней'],[Math.floor(d/36e5)%24,'часов'],[Math.floor(d/6e4)%60,'минут'],[Math.floor(d/1e3)%60,'секунд']];
    box.innerHTML = v.map(([n,l])=>`<div><b>${n}</b><span>${l}</span></div>`).join('');
  };
  draw(); setInterval(draw, 1000);
} else { $('#days').style.display = 'none'; }

// ===== Галерея =====
const grid = $('#grid'), fileIn = $('#file'); let target = null;
CFG.photos.forEach((src, i) => {
  const el = document.createElement('div'); el.className = 'slot'; el.style.transitionDelay = (i%3)*.12+'s';
  const cap = `<div class="cap">${CFG.captions[i] || ''}</div>`;
  el.innerHTML = src ? `<img src="${src}" alt="" onerror="this.closest('.slot').remove()">${cap}` : `<div class="ph">+ добавить фото</div>${cap}`;
  el.onclick = () => {
    const img = el.querySelector('img');
    if (img) { $('#lb img').src = img.src; $('#lb').classList.add('open'); }
    else { target = el; fileIn.click(); }
  };
  el.onmousemove = e => { const b = el.getBoundingClientRect();
    const x = (e.clientX-b.left)/b.width-.5, y = (e.clientY-b.top)/b.height-.5;
    el.style.transition = 'box-shadow .3s';
    el.style.transform = `rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`; };
  el.onmouseleave = () => { el.style.transition = ''; el.style.transform = ''; };
  grid.appendChild(el);
});
fileIn.onchange = () => {
  const f = fileIn.files[0]; if (!f || !target) return;
  const r = new FileReader();
  r.onload = () => { target.querySelector('.ph')?.remove();
    const im = new Image(); im.src = r.result; target.prepend(im); };
  r.readAsDataURL(f); fileIn.value = '';
};
$('#lb').onclick = () => $('#lb').classList.remove('open');
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add('in')), {threshold:.15});
document.querySelectorAll('.slot').forEach(s => io.observe(s));

// ===== Кнопка =====
$('#love').onclick = e => {
  const r = e.target.getBoundingClientRect();
  for (let i=0;i<45;i++) spawn(r.left+r.width/2, r.top+r.height/2, true);
  e.target.textContent = 'Спасибо, что ты такая ✨';
};
</script>
</body>
</html>
